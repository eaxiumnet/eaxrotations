name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  all-checks:
    name: All Checks (make)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
          sudo ln -sf /usr/bin/luac5.1 /usr/local/bin/luac
          sudo ln -sf /usr/bin/lua5.1 /usr/local/bin/lua

      # We use a single unified script rather than separate steps so the
      # same command developers run locally (sh tools/run_all_checks.sh) is
      # exactly what CI executes — no drift between local and CI behavior.
      - name: Run all checks
        run: sh tools/run_all_checks.sh
