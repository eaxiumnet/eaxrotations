name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify-all:
    name: Verify (luac + audits + battery + probe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        # v5 runs on node24 (v4 was node20 and triggered the GitHub
        # Node.js-20 deprecation annotation); actions/checkout@v7 is the
        # newest major if we want to track latest later.
        uses: actions/checkout@v5

      - name: actionlint (workflow syntax gate)
        # Static check for .github/workflows/*.yml — catches malformed YAML,
        # bad ${{ }} expressions, unknown keys, wrong action inputs, and
        # shellcheck issues in run: blocks that GitHub would otherwise
        # silently ignore. Version pinned to 1.7.12 (download script arg);
        # any finding or download failure exits nonzero and fails the build.
        # Lints this file itself, so a regression here is caught on the next
        # push.
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash 1.7.12)
          ./actionlint -color
        shell: bash

      - name: Install Lua 5.1
        # The game runtime is LuaJIT (~Lua 5.1); parse-gate with the same
        # version the local pre-commit hook uses. v13 is an ESM rewrite that
        # DEFAULTS to luaVersion 5.5 — the explicit 5.1 pin below is
        # load-bearing and must not be removed.
        uses: leafo/gh-actions-lua@v13.0.0
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        # Companion action to leafo/gh-actions-lua — auto-detects the Lua
        # installation from the step above. v6.1.0 defaults to LuaRocks
        # 3.13.0, same as v6.
        uses: leafo/gh-actions-luarocks@v6.1.0

      - name: Install luafilesystem (lfs)
        # Hard requirement: the clean-checkout dependency probe fails closed
        # without lfs, and 4 rotation suites + the behavioral battery use it.
        run: luarocks install luafilesystem

      - name: luac -p syntax gate (all EaxRotations .lua)
        # Mirrors pre-commit step [1/15] (luac parse).
        # NOTE: self-contained on tracked files — tools/, AGENTS.md and .github/
        # are untracked by design, so the workflow runs the tracked gate
        # directly instead of shelling out to the local tools/ scripts.
        run: |
          find EaxRotations -name '*.lua' -print0 | while IFS= read -r -d '' f; do
            luac -p "$f" || { echo "FAIL: luac -p $f"; exit 1; }
          done

      - name: badge-drift check (README + PVP registered totals)
        # Mirrors pre-commit step [4/15] (badge drift).
        # tools/update_badges.lua is tracked; AGENTS.md is documented
        # local-only, so the tool skips its section with a note when absent.
        run: lua tools/update_badges.lua --check

      - name: verify_all matrix (rotation + leveling + WotLK tests + 4 audits + pinned-rank self-tests + behavioral battery + clean-checkout probe)
        # Single entry point that fails only on *unexpected* failures: spawns
        # every tracked runner (run_rotation_tests, run_leveling_tests,
        # run_wotlk_tests, the sylvanas/vanilla-contamination/
        # vanilla-existence/wotlk audits + their --self-test pinned-rank modes,
        # behavioral_audit, and run_clean_checkout_probe) and parses each one's
        # own totals. test_sod_source_audit self-provisions its gitignored
        # .omo/evidence via the tracked generator, so no untracked inputs are
        # needed on a clean checkout.
        run: lua EaxRotations/tests/run_verify_all.lua

  # Build the release artifact (eaxrotations.zip: tracked lua + md only) so
  # releases don't depend on the maintainer's machine. Runs only on master
  # pushes and manual dispatch — NOT on PRs — to avoid artifact churn.
  # python3 is preinstalled on ubuntu-latest; no extra setup step needed.
  release-artifact:
    name: Build release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The script runs `git -C REPO_ROOT archive HEAD -- EaxRotations/`, so the
    # checkout must be a real repo; actions/checkout@v5 (full clone, no depth
    # limit) as used by verify-all satisfies that.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build release zip
        # cwd-independent: the script derives the repo root from its own path,
        # so it is safe to run from the checkout root. The script self-verifies
        # (zero entries, any non-lua/md file, or a git archive failure exits
        # nonzero), which fails this step and therefore the job.
        run: python3 tools/create_release_zip.py eaxrotations.zip

      - name: Verify artifact is non-empty
        # The script's own checks are the primary gate; this is a belt-and-
        # suspenders guard against a silently-empty (but script-valid) zip.
        run: |
          test -s eaxrotations.zip
          SZ=$(stat -c %s eaxrotations.zip)
          echo "eaxrotations.zip is $SZ bytes"
          [ "$SZ" -gt 1048576 ] || { echo "ERROR: artifact suspiciously small"; exit 1; }

      - name: Verify artifact matches the tracked tree (entry-count pin)
        # Self-consistent pin: the artifact must contain EXACTLY the tracked
        # lua+md files — no extras (a stray file type the script filter should
        # have dropped), no missing (a tracked file the archive failed to
        # include), no count drift. The expected count is computed dynamically
        # from git ls-files (833 today; no hardcoded number), so a new tracked
        # file automatically re-pins without an edit.
        run: |
          python3 - <<'PY'
          import subprocess, sys, zipfile

          art = zipfile.ZipFile("eaxrotations.zip").namelist()
          art_set = set(art)
          if len(art_set) != len(art):
              print("ERROR: duplicate entries in artifact"); sys.exit(1)

          tracked = set()
          out = subprocess.run(["git", "ls-files", "EaxRotations/"],
                               capture_output=True, text=True, check=True)
          for line in out.stdout.splitlines():
              p = line.strip()
              if p.startswith("EaxRotations/"):
                  p = p[len("EaxRotations/"):]
              if p.endswith(".lua") or p.endswith(".md"):
                  tracked.add(p)

          extra = sorted(art_set - tracked)
          missing = sorted(tracked - art_set)
          print("artifact entries: %d (lua+md only)" % len(art_set))
          print("tracked lua+md:   %d" % len(tracked))
          if extra or missing:
              if extra:
                  print("ERROR: %d untracked/extra files in artifact:" % len(extra))
                  for n in extra[:20]:
                      print("  +", n)
              if missing:
                  print("ERROR: %d tracked files missing from artifact:" % len(missing))
                  for n in missing[:20]:
                      print("  -", n)
              sys.exit(1)
          print("OK: artifact == tracked tree")
          PY

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: eaxrotations-release
          path: eaxrotations.zip
          if-no-files-found: error
          retention-days: 30
