name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify-all:
    name: Verify (luac + audits + battery + probe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        # v5 runs on node24 (v4 was node20 and triggered the GitHub
        # Node.js-20 deprecation annotation); actions/checkout@v7 is the
        # newest major if we want to track latest later.
        uses: actions/checkout@v5

      - name: actionlint (workflow syntax gate)
        # Static check for .github/workflows/*.yml — catches malformed YAML,
        # bad ${{ }} expressions, unknown keys, wrong action inputs, and
        # shellcheck issues in run: blocks that GitHub would otherwise
        # silently ignore. Version pinned to 1.7.12 (download script arg);
        # any finding or download failure exits nonzero and fails the build.
        # Lints this file itself, so a regression here is caught on the next
        # push.
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash 1.7.12)
          ./actionlint -color
        shell: bash

      - name: Install Lua 5.1
        # The game runtime is LuaJIT (~Lua 5.1); parse-gate with the same
        # version the local pre-commit hook uses. v13 is an ESM rewrite that
        # DEFAULTS to luaVersion 5.5 — the explicit 5.1 pin below is
        # load-bearing and must not be removed.
        uses: leafo/gh-actions-lua@v13.0.0
        with:
          luaVersion: "5.1"

      - name: Install LuaRocks
        # Companion action to leafo/gh-actions-lua — auto-detects the Lua
        # installation from the step above. v6.1.0 defaults to LuaRocks
        # 3.13.0, same as v6.
        uses: leafo/gh-actions-luarocks@v6.1.0

      - name: Install luafilesystem (lfs)
        # Hard requirement: the clean-checkout dependency probe fails closed
        # without lfs, and 4 rotation suites + the behavioral battery use it.
        run: luarocks install luafilesystem

      - name: luac -p syntax gate (all EaxRotations .lua)
        # Mirrors pre-commit step [1/4] and run_all_checks.sh step [2/7].
        # NOTE: self-contained on tracked files — tools/, AGENTS.md and .github/
        # are untracked by design, so the workflow runs the tracked gate
        # directly instead of shelling out to the local tools/ scripts.
        run: |
          find EaxRotations -name '*.lua' -print0 | while IFS= read -r -d '' f; do
            luac -p "$f" || { echo "FAIL: luac -p $f"; exit 1; }
          done

      - name: badge-drift check (README + PVP registered totals)
        # Mirrors pre-commit step [4/4] and run_all_checks.sh step [5/7].
        # tools/update_badges.lua is tracked; AGENTS.md is documented
        # local-only, so the tool skips its section with a note when absent.
        run: lua tools/update_badges.lua --check

      - name: verify_all matrix (rotation + leveling + WotLK tests + 4 audits + pinned-rank self-tests + behavioral battery + clean-checkout probe)
        # Single entry point that fails only on *unexpected* failures: spawns
        # every tracked runner (run_rotation_tests, run_leveling_tests,
        # run_wotlk_tests, the sylvanas/vanilla-contamination/
        # vanilla-existence/wotlk audits + their --self-test pinned-rank modes,
        # behavioral_audit, and run_clean_checkout_probe) and parses each one's
        # own totals. test_sod_source_audit self-provisions its gitignored
        # .omo/evidence via the tracked generator, so no untracked inputs are
        # needed on a clean checkout.
        run: lua EaxRotations/tests/run_verify_all.lua
